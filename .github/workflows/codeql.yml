name: Optional CodeQL Rust analysis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codeql:
    name: CodeQL Rust analysis (public repositories)
    # GitHub Free does not include CodeQL for private repositories.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize CodeQL Rust without rebuilding the backend
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: rust
          build-mode: none
          queries: security-extended
      - name: Analyze and publish code scanning alerts
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
