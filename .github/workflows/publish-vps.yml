name: Publish to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-vps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Required backend security checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  migrate:
    needs: security
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_CA_CERT: ${{ secrets.SUPABASE_DB_CA_CERT }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup update stable --no-self-update

      - name: Cache Cargo downloads and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run database migrations
        run: cargo run --locked --bin migrate --release

  build:
    needs: security
    runs-on: ubuntu-latest
    outputs:
      repo_lc: ${{ steps.repo-lc.outputs.repo }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Lowercase repository name
        id: repo-lc
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ steps.repo-lc.outputs.repo }}:sha-${{ github.sha }}
            ghcr.io/${{ steps.repo-lc.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build, migrate]
    runs-on: ubuntu-latest
    steps:
      # deploy/compose.yaml and deploy/Caddyfile are copied to the VPS below.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          sparse-checkout: deploy

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install --yes sshpass

      - name: Update the compose stack on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ needs.build.outputs.repo_lc }}:sha-${{ github.sha }}
          # Public hostname served by Caddy, e.g. careerbridge.example.com
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_CA_CERT: ${{ secrets.SUPABASE_DB_CA_CERT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_CV_BUCKET: ${{ secrets.SUPABASE_CV_BUCKET }}
          CV_ENCRYPTION_KEY: ${{ secrets.CV_ENCRYPTION_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          AUTH_ORIGINS: ${{ secrets.AUTH_ORIGINS }}
          AUTH_COOKIE_SECURE: ${{ secrets.AUTH_COOKIE_SECURE }}
          AUTH_SIGNUP_OTP_ENABLED: ${{ secrets.AUTH_SIGNUP_OTP_ENABLED }}
          RUST_LOG: ${{ secrets.RUST_LOG }}
          JOB_SCRAPE_ENABLED: ${{ secrets.JOB_SCRAPE_ENABLED }}
          JOB_SCRAPE_INTERVAL_SECONDS: ${{ secrets.JOB_SCRAPE_INTERVAL_SECONDS }}
          JOB_SCRAPE_SOURCES: ${{ secrets.JOB_SCRAPE_SOURCES }}
          OPENWEBNINJA_API_KEY: ${{ secrets.OPENWEBNINJA_API_KEY }}
          OPENWEBNINJA_QUERIES_PER_RUN: ${{ secrets.OPENWEBNINJA_QUERIES_PER_RUN }}
        run: |
          set -euo pipefail
          # Trim whitespace introduced when pasting connection secrets.
          for name in VPS_HOST VPS_USERNAME APP_DOMAIN; do
            value="${!name}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf -v "$name" '%s' "$value"
          done
          : "${VPS_HOST:?Set VPS_HOST in GitHub Actions secrets}"
          : "${VPS_USERNAME:?Set VPS_USERNAME in GitHub Actions secrets}"
          : "${VPS_PASSWORD:?Set VPS_PASSWORD in GitHub Actions secrets}"
          : "${APP_DOMAIN:?Set APP_DOMAIN in GitHub Actions secrets}"
          if [[ ! "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]]; then
            echo 'VPS_HOST must contain only an IP address or hostname, without a URL scheme, username, port suffix, or whitespace.' >&2
            exit 1
          fi
          if [[ ! "$VPS_USERNAME" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ ]]; then
            echo 'VPS_USERNAME contains invalid characters.' >&2
            exit 1
          fi
          if [[ ! "$APP_DOMAIN" =~ ^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$ ]]; then
            echo 'APP_DOMAIN must be a bare hostname such as careerbridge.example.com, without https:// or a path.' >&2
            exit 1
          fi
          COMPOSE_B64=$(base64 -w0 deploy/compose.yaml)
          CADDYFILE_B64=$(base64 -w0 deploy/Caddyfile)

          # Send shell-quoted assignments over SSH stdin, including multiline PEM values.
          {
            for name in GHCR_USERNAME GHCR_TOKEN IMAGE APP_DOMAIN COMPOSE_B64 CADDYFILE_B64 SUPABASE_DB_URL SUPABASE_DB_CA_CERT SUPABASE_URL SUPABASE_SECRET_KEY SUPABASE_CV_BUCKET CV_ENCRYPTION_KEY LLM_BASE_URL LLM_API_KEY LLM_MODEL CORS_ORIGINS AUTH_ORIGINS AUTH_COOKIE_SECURE AUTH_SIGNUP_OTP_ENABLED RUST_LOG JOB_SCRAPE_ENABLED JOB_SCRAPE_INTERVAL_SECONDS JOB_SCRAPE_SOURCES OPENWEBNINJA_API_KEY OPENWEBNINJA_QUERIES_PER_RUN; do
              printf 'export %s=%q\n' "$name" "${!name}"
            done
            cat <<'REMOTE'
          set -euo pipefail

          if ! docker compose version >/dev/null 2>&1; then
            echo 'The VPS needs the Docker Compose v2 plugin ("docker compose version" failed).' >&2
            exit 1
          fi

          umask 077
          mkdir -p "$HOME/careerbridge"
          cd "$HOME/careerbridge"
          printf '%s' "$COMPOSE_B64" | base64 -d > compose.yaml
          printf '%s' "$CADDYFILE_B64" | base64 -d > Caddyfile
          chmod 644 Caddyfile

          : "${SUPABASE_CV_BUCKET:=cv-private}"
          : "${LLM_BASE_URL:=https://generativelanguage.googleapis.com/v1beta/openai}"
          : "${LLM_MODEL:=gemini-2.5-flash}"
          : "${AUTH_COOKIE_SECURE:=true}"
          : "${AUTH_SIGNUP_OTP_ENABLED:=true}"
          : "${RUST_LOG:=info}"
          : "${JOB_SCRAPE_ENABLED:=false}"
          : "${JOB_SCRAPE_INTERVAL_SECONDS:=21600}"
          : "${JOB_SCRAPE_SOURCES:=grab,cermati,dkatalis,softwareseni,kredivo,openwebninja}"
          : "${OPENWEBNINJA_QUERIES_PER_RUN:=2}"

          # Compose reads single-quoted env_file values literally: no $ expansion,
          # and a multiline PEM stays intact.
          for name in SUPABASE_DB_URL SUPABASE_DB_CA_CERT SUPABASE_URL SUPABASE_SECRET_KEY SUPABASE_CV_BUCKET CV_ENCRYPTION_KEY LLM_BASE_URL LLM_API_KEY LLM_MODEL CORS_ORIGINS AUTH_ORIGINS AUTH_COOKIE_SECURE AUTH_SIGNUP_OTP_ENABLED RUST_LOG JOB_SCRAPE_ENABLED JOB_SCRAPE_INTERVAL_SECONDS JOB_SCRAPE_SOURCES OPENWEBNINJA_API_KEY OPENWEBNINJA_QUERIES_PER_RUN; do
            value="${!name}"
            case "$value" in
              *\'*)
                echo "$name contains a single quote, which be.env cannot hold." >&2
                exit 1
                ;;
            esac
            printf "%s='%s'\n" "$name" "$value"
          done > be.env.tmp
          mv be.env.tmp be.env

          # ponytail: no lock on .env; the frontend workflow edits FE_IMAGE in the
          # same file. Add flock if the two deploys ever overlap in practice.
          set_env() {
            { grep -v "^$1=" .env 2>/dev/null || true; printf '%s=%s\n' "$1" "$2"; } > .env.tmp
            mv .env.tmp .env
          }
          set_env BE_IMAGE "$IMAGE"
          set_env DOMAIN "$APP_DOMAIN"

          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          docker compose pull be
          # Retire the pre-compose container and its public port 8080.
          docker rm -f careerbridge-be 2>/dev/null || true
          # fe belongs to the frontend workflow; --no-deps leaves it untouched.
          docker compose up -d --no-deps be caddy
          # Caddy only rereads a changed Caddyfile when told to.
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile >/dev/null 2>&1 \
            || docker compose restart caddy

          be_id=$(docker compose ps -q be)
          healthy=false
          for attempt in $(seq 1 72); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' "$be_id")" = healthy ]; then
              healthy=true
              break
            fi
            sleep 5
          done
          if [ "$healthy" != true ]; then
            docker compose logs --tail 80 be >&2
            echo 'Backend did not become healthy within 6 minutes.' >&2
            exit 1
          fi

          docker image prune -f
          REMOTE
          } | sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            "$VPS_USERNAME@$VPS_HOST" 'bash -s'
