# Repository scans do not build images or require production credentials.
# Secrets are scanned in a separate CI step at every severity: a leaked JWT or webhook is rated MEDIUM.
timeout: 10m
exit-code: 1
severity:
  - HIGH
  - CRITICAL
scan:
  scanners:
    - vuln
    - misconfig
  skip-dirs:
    - .git
    - target
    - .cache
    - .venv
