[package]
name = "careerbridge-be"
version = "0.1.0"
edition = "2024"
default-run = "careerbridge-be"

[dependencies]
actix-web = { version = "4", default-features = false, features = ["macros", "cookies"] }
actix-cors = "0.7"
actix-multipart = "0.7"
aes-gcm = "0.10"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
fastembed = { version = "=7.5.0", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
futures-util = "0.3"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
pdf-extract = "0.12.1"
pgvector = { version = "0.4", features = ["sqlx"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
zeroize = "1"
utoipa = { version = "=6.0.0", features = ["uuid", "chrono"] }

[dev-dependencies]
actix-rt = "2"

[profile.release]
lto = "thin"
strip = true

[target.'cfg(unix)'.dependencies]
rlimit = "0.11"
